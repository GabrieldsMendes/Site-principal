# Site estático: sem build. Publica a raiz do repositório.
[build]
  publish = "."

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens: 30 dias. Ao trocar uma imagem, troque também o nome do arquivo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/amostra-trilha-dos-15-minutos.pdf"
  [headers.values]
    Content-Disposition = "attachment; filename=\"Amostra - Trilha dos 15 Minutos.pdf\""
    Cache-Control = "public, max-age=86400"
